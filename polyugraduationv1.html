<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Sun Family 畢業倒數</title>

  <style>
    :root {
      --brown: #593b2c;
      --dark-brown: #352015;
      --paper: #fffdf5;
      --pink: #ef5b68;
      --orange: #ff9d4d;
      --yellow: #ffd84d;
      --purple: #9b7bea;
      --blue: #58bde8;
      --green: #72c98a;
      --muted: #8c8173;
      --line: #f3c96b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      color: var(--brown);
      background:
        radial-gradient(circle at 8% 12%, #ffffff 0 5px, transparent 6px),
        radial-gradient(circle at 88% 18%, #ffffff 0 4px, transparent 5px),
        linear-gradient(
          180deg,
          #73d9f5 0%,
          #b9f0f4 45%,
          #fff0b8 100%
        );
      background-size: 90px 90px, 120px 120px, 100% 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang HK",
        "Microsoft JhengHei",
        sans-serif;
    }

    body::before {
      content: "☀️";
      position: fixed;
      top: 12px;
      left: 8px;
      z-index: -1;
      font-size: 3.2rem;
      transform: rotate(-12deg);
    }

    body::after {
      content: "🌈";
      position: fixed;
      right: -8px;
      bottom: 45px;
      z-index: -1;
      font-size: 4.4rem;
      transform: rotate(8deg);
    }

    .page {
      width: min(100%, 480px);
      height: 100svh;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }

    .decoration {
      position: relative;
      flex: none;
      height: 40px;
    }

    .graduation-cap {
      position: absolute;
      top: -6px;
      right: 12px;
      font-size: 2.6rem;
      transform: rotate(8deg);
      filter: drop-shadow(0 4px 0 rgba(80, 80, 80, 0.15));
    }

    .book {
      position: absolute;
      top: 6px;
      left: 13px;
      font-size: 1.8rem;
      transform: rotate(-8deg);
    }

    .star {
      position: absolute;
      color: var(--yellow);
      font-size: 1.3rem;
      text-shadow: 0 2px 0 #f1994a;
    }

    .star.one {
      top: 2px;
      left: 78px;
    }

    .star.two {
      top: 18px;
      right: 75px;
      font-size: 0.9rem;
    }

    .star.three {
      top: 5px;
      right: 132px;
      font-size: 0.8rem;
    }

    .title {
      flex: none;
      color: #ffffff;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 2px;
      text-align: center;
      text-shadow:
        0 4px 0 var(--pink),
        0 6px 0 rgba(80, 150, 180, 0.25);
    }

    .family-badge {
      width: fit-content;
      margin: 8px auto 0;
      padding: 6px 16px;
      color: #ffffff;
      background: linear-gradient(
        135deg,
        var(--orange),
        var(--pink)
      );
      border: 3px solid #ffffff;
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(170, 82, 70, 0.22);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 1px;
      transform: rotate(-2deg);
    }

    .subtitle {
      flex: none;
      margin-top: 6px;
      color: #d74859;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
    }

    .card {
      flex: none;
      margin-top: 10px;
      padding: 13px;
      background: rgba(255, 253, 245, 0.95);
      border: 3px solid #ffffff;
      border-radius: 18px;
      box-shadow:
        0 5px 0 rgba(91, 64, 48, 0.15),
        0 10px 18px rgba(91, 64, 48, 0.1);
    }

    .clock-card {
      padding: 13px 10px 12px;
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.78)
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 22px,
          rgba(255, 216, 77, 0.2) 23px
        );
      text-align: center;
    }

    .clock-label {
      color: var(--purple);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    #date {
      margin-top: 4px;
      color: var(--brown);
      font-size: 0.84rem;
      font-weight: 800;
    }

    #clock {
      margin-top: 2px;
      color: var(--dark-brown);
      font-size: clamp(2.8rem, 14vw, 4.3rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color: var(--dark-brown);
      font-size: 1rem;
      font-weight: 900;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      background: var(--yellow);
      border-radius: 50%;
      font-size: 1.1rem;
    }

    .weather-card {
      background: linear-gradient(145deg, #fffdf5, #e9f8ff);
    }

    .weather-content {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      align-items: center;
      gap: 10px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      background: #dff6ff;
      border: 2px solid #9dddf0;
      border-radius: 13px;
    }

    #weatherIcon {
      font-size: 2.1rem;
    }

    #temperature {
      color: #249ac5;
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1;
    }

    .weather-unit {
      color: #249ac5;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .weather-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .weather-info div {
      padding: 9px 5px;
      color: var(--muted);
      background: #fff2bd;
      border: 2px solid #f0d36a;
      border-radius: 13px;
      font-size: 0.7rem;
      text-align: center;
    }

    .weather-info strong {
      display: block;
      margin-top: 3px;
      color: var(--brown);
      font-size: 0.85rem;
    }

    #weatherUpdate {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.62rem;
      text-align: center;
    }

    .countdown-card {
      padding: 15px 12px 13px;
      background:
        linear-gradient(
          rgba(255, 253, 245, 0.95),
          rgba(255, 253, 245, 0.95)
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 25px,
          rgba(239, 91, 104, 0.12) 26px
        );
      border-color: var(--yellow);
    }

    .countdown-title {
      margin-bottom: 11px;
      color: var(--pink);
      font-size: clamp(1.3rem, 6vw, 1.8rem);
      font-weight: 900;
      text-align: center;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .time-box {
      padding: 9px 2px 7px;
      background: linear-gradient(
        180deg,
        #5b3c99,
        #392767
      );
      border: 3px solid var(--yellow);
      border-radius: 13px;
      text-align: center;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.12),
        0 3px 0 rgba(95, 59, 160, 0.2);
    }

    .time-value {
      color: #fff48b;
      font-size: clamp(1.55rem, 8vw, 2.35rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .time-label {
      margin-top: 5px;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 900;
    }

    .target-date {
      margin-top: 10px;
      color: var(--pink);
      font-size: 0.82rem;
      font-weight: 900;
      text-align: center;
    }

    .note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 700;
      text-align: center;
    }

    .footer {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
      color: rgba(56, 37, 27, 0.72);
      font-size: 0.65rem;
      font-weight: 800;
      text-align: center;
    }

    @media (max-height: 680px) {
      .page {
        padding-top: 7px;
      }

      .decoration {
        height: 28px;
      }

      .graduation-cap {
        font-size: 2rem;
      }

      .book {
        font-size: 1.4rem;
      }

      .card {
        margin-top: 6px;
        padding: 9px;
      }

      #clock {
        font-size: 2.7rem;
      }

      .family-badge {
        margin-top: 4px;
        padding: 4px 13px;
      }

      .subtitle {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="decoration">
      <div class="graduation-cap">🎓</div>
      <div class="book">📚</div>
      <div class="star one">✦</div>
      <div class="star two">✧</div>
      <div class="star three">✦</div>
    </div>

    <h1 class="title">🎓 畢業倒數 🎉</h1>

    <div class="family-badge">
      ☀️ Sun Family ☀️
    </div>

    <div class="subtitle">
      一齊努力，一齊倒數，準備迎接畢業大日子！✨
    </div>

    <!-- 日期及時間 -->
    <section class="card clock-card">
      <div class="clock-label">
        TODAY IS A GREAT STUDY DAY
      </div>

      <div id="date">載入中...</div>
      <div id="clock">00:00:00</div>
    </section>

    <!-- 天氣 -->
    <section class="card weather-card">
      <div class="section-title">
        <div class="section-icon">🌤️</div>
        <div>今日香港天氣</div>
      </div>

      <div class="weather-content">
        <div class="weather-main">
          <div id="weatherIcon">🌤️</div>

          <div>
            <span id="temperature">--</span>
            <span class="weather-unit">°C</span>
          </div>
        </div>

        <div class="weather-info">
          <div>
            💧 濕度
            <strong>
              <span id="humidity">--</span>%
            </strong>
          </div>

          <div>
            📍 地點
            <strong>香港</strong>
          </div>
        </div>
      </div>

      <div id="weatherUpdate">
        天氣資料載入中...
      </div>
    </section>

    <!-- 畢業倒數 -->
    <section class="card countdown-card">
      <div class="countdown-title">
        🎓 Sun Family 距離畢業還有 🎉
      </div>

      <div class="countdown-grid">
        <div class="time-box">
          <div class="time-value" id="days">00</div>
          <div class="time-label">日</div>
        </div>

        <div class="time-box">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">小時</div>
        </div>

        <div class="time-box">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">分鐘</div>
        </div>

        <div class="time-box">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">秒</div>
        </div>
      </div>

      <div class="target-date">
        🎊 畢業日：2026年10月24日 🎊
      </div>

      <div class="note">
        每一日都係向夢想進發的一小步！🌈📚
      </div>
    </section>

    <footer class="footer">
      ☀️ Sun Family · Made with love, dreams and happiness 🎓
    </footer>
  </main>

  <script>
    const HKO_API =
      "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";

    // 畢業日期：2026年10月24日 00:00，香港時間
    const targetDate = new Date(
      "2026-10-24T00:00:00+08:00"
    ).getTime();

    const weekDays = [
      "星期日",
      "星期一",
      "星期二",
      "星期三",
      "星期四",
      "星期五",
      "星期六"
    ];

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const day = weekDays[now.getDay()];

      document.getElementById("date").textContent =
        `${year}年${month}月${date}日 ${day}`;

      document.getElementById("clock").textContent =
        `${pad(now.getHours())}:` +
        `${pad(now.getMinutes())}:` +
        `${pad(now.getSeconds())}`;
    }

    function updateCountdown() {
      const difference = targetDate - Date.now();

      if (difference <= 0) {
        document.querySelector(".countdown-title").textContent =
          "🎉 Sun Family 恭喜畢業！🎓";

        ["days", "hours", "minutes", "seconds"].forEach((id) => {
          document.getElementById(id).textContent = "00";
        });

        return;
      }

      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (difference % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (difference % (1000 * 60)) /
        1000
      );

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    function getWeatherIcon(iconCode) {
      const icons = {
        50: "☀️",
        51: "🌤️",
        52: "🌤️",
        53: "🌦️",
        54: "🌦️",
        60: "🌧️",
        61: "🌧️",
        62: "⛈️",
        63: "⛈️",
        64: "🌧️",
        65: "🌧️",
        70: "🌫️",
        71: "🌫️",
        72: "🌫️",
        80: "🌪️",
        81: "🌪️",
        82: "🌪️",
        90: "🌩️"
      };

      return icons[iconCode] || "🌤️";
    }

    async function loadWeather() {
      try {
        const response = await fetch(
          `${HKO_API}?dataType=rhrread&lang=tc`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Weather request failed");
        }

        const data = await response.json();

        const temperatureData =
          data.temperature?.data || [];

        const humidityData =
          data.humidity?.data || [];

        const temperature =
          temperatureData.find(
            item => item.place === "香港天文台"
          ) || temperatureData[0];

        const humidity =
          humidityData.find(
            item => item.place === "香港天文台"
          ) || humidityData[0];

        document.getElementById("temperature").textContent =
          temperature?.value ?? "--";

        document.getElementById("humidity").textContent =
          humidity?.value ?? "--";

        document.getElementById("weatherIcon").textContent =
          getWeatherIcon(data.icon?.[0]);

        if (data.updateTime) {
          const updateTime = new Date(data.updateTime);

          document.getElementById("weatherUpdate").textContent =
            `香港天文台更新：${updateTime.toLocaleTimeString(
              "zh-HK",
              {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              }
            )}`;
        }
      } catch (error) {
        console.error(error);

        document.getElementById("weatherUpdate").textContent =
          "天氣資料暫時未能載入";
      }
    }

    function updatePage() {
      updateClock();
      updateCountdown();
    }

    updatePage();
    loadWeather();

    setInterval(updatePage, 1000);

    // 每 30 分鐘更新一次天氣
    setInterval(loadWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
